apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: django-app
  template:
    metadata:
      labels:
        app: django-app
    spec:
      nodeSelector:
        kubernetes.azure.com/mode: user
      containers:
        - name: django-app
          image: usermanagementacr.azurecr.io/django:latest
          ports:
            - containerPort: 8000

          env:
            - name: ALLOWED_HOSTS
              value: "74.225.28.101"

            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: django-secret
                  key: AZURE_TENANT_ID

            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: django-secret
                  key: AZURE_CLIENT_ID

            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: django-secret
                  key: AZURE_CLIENT_SECRET

            - name: AZURE_REDIRECT_URI
              value: "http://74.225.28.101/auth/callback/"
