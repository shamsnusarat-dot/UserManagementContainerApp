apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: django-app
  template:
    metadata:
      labels:
        app: django-app
    spec:
      nodeSelector:
        kubernetes.azure.com/mode: user
      containers:
        - name: django-app
          image: usermanagementacr.azurecr.io/django:latest
          ports:
            - containerPort: 8000